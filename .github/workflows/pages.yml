# The dashboard as a website: every 15 minutes, fetch a fresh snapshot.json with craft-fetch
# and deploy it to GitHub Pages next to the compiled UI (ui/index.html, style.css, build/).
# The snapshot is deployed, never committed, so main's history stays clean.
name: Pages

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer snapshot never gets cancelled by an older run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build the UI
        run: npm ci && npm run build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # GITHUB_TOKEN reads the public repos' data (1,000 GraphQL points an hour; a run costs
      # about 100). The config only overrides the intervals, so the footer and STALE pill match
      # this schedule (Actions often starts scheduled runs late); the repo list stays the default.
      - name: Fetch the snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf 'poll_minutes = 15.0\nstale_minutes = 60.0\n' > ~/.craft_status_config.toml
          mkdir _site
          cp -R ui/index.html ui/style.css ui/build _site/
          cargo run -q -p craft-github --bin craft-fetch -- --snapshot _site/snapshot.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
